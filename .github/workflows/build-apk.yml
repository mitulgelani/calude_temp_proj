# Free APK builds on GitHub's servers. Push this project to a GitHub repo, then:
#   Actions tab → "Build APK" → Run workflow   (or just push to main)
# The APK appears under Releases (direct download link) and as a workflow artifact.
name: Build APK

on:
  push:
    branches: [main, master, pluck-app]
    paths-ignore: ["tool/*_check.py", "tool/emulator_test.sh", "tool/ui.py", ".github/workflows/*-test.yml"]
  workflow_dispatch:
    inputs:
      play_store:
        description: "Google Play build (hides YouTube)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project + wire Chaquopy
        run: python tool/setup.py

      - name: Build APK
        run: |
          YT=true
          if [ "${{ inputs.play_store }}" = "true" ]; then YT=false; fi
          N=${{ github.run_number }}
          for pair in "arm64-v8a:android-arm64:arm64" "armeabi-v7a:android-arm:32bit" "x86_64:android-x64:x86_64"; do
            IFS=: read ABI PLAT NAME <<< "$pair"
            sed -i "s/abiFilters += .*/abiFilters += listOf(\"$ABI\")/" android/app/build.gradle.kts
            grep -n "abiFilters" android/app/build.gradle.kts
            flutter build apk --release --target-platform $PLAT --dart-define=PLUCK_YOUTUBE=$YT
            cp build/app/outputs/flutter-apk/app-release.apk pluck-$N-$NAME.apk
          done
          ls -la pluck-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pluck-apk
          path: pluck-*.apk

      - name: Publish as a release (direct download link)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" pluck-*.apk \
            --title "Pluck build ${{ github.run_number }}" \
            --notes "Download pluck-N-arm64.apk (works on almost every phone). Use the 32bit one only on very old phones." \
            --latest
