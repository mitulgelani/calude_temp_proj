# Free APK builds on GitHub's servers. Push this project to a GitHub repo, then:
#   Actions tab → "Build APK" → Run workflow   (or just push to main)
# The APK appears under Releases (direct download link) and as a workflow artifact.
name: Build APK

on:
  push:
    branches: [main, master, pluck-app]
    paths-ignore: ["tool/*_check.py", "tool/emulator_test.sh", "tool/ui.py", ".github/workflows/*-test.yml"]
  workflow_dispatch:
    inputs:
      play_store:
        description: "Google Play build (hides YouTube)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project + wire Chaquopy
        run: python tool/setup.py

      - name: Build APK
        run: |
          YT=true
          if [ "${{ inputs.play_store }}" = "true" ]; then YT=false; fi
          flutter build apk --release --split-per-abi --dart-define=PLUCK_YOUTUBE=$YT
          O=build/app/outputs/flutter-apk; N=${{ github.run_number }}
          cp $O/app-arm64-v8a-release.apk pluck-$N-arm64.apk        # almost every phone
          cp $O/app-armeabi-v7a-release.apk pluck-$N-32bit.apk      # very old phones
          cp $O/app-x86_64-release.apk pluck-$N-x86_64.apk          # emulators
          ls -la pluck-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pluck-apk
          path: pluck-*.apk

      - name: Publish as a release (direct download link)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" pluck-*.apk \
            --title "Pluck build ${{ github.run_number }}" \
            --notes "Download pluck-N-arm64.apk (works on almost every phone). Use the 32bit one only on very old phones." \
            --latest
