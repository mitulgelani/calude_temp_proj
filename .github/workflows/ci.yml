name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      INSTAGRAM_WEBHOOK_VERIFY_TOKEN: ci-verify-token
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: |
          mkdir -p ci-out
          npm install --no-audit --no-fund 2>&1 | tee ci-out/install.log

      - name: Type check
        run: npx tsc --noEmit 2>&1 | tee ci-out/typecheck.log; exit ${PIPESTATUS[0]}

      - name: Build
        run: npm run build 2>&1 | tee ci-out/build.log; exit ${PIPESTATUS[0]}

      - name: Smoke test and screenshots
        run: |
          npm install --no-save --no-audit --no-fund playwright@1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          (npm start > ci-out/server.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:3000 >/dev/null && break; sleep 1; done
          node scripts/smoke.mjs 2>&1 | tee ci-out/smoke.log

      - name: Publish results to the ci-results branch
        if: always()
        run: |
          cp -r ci-out /tmp/ci-out
          git config user.name "hookline-ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-results
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdxq
          cp -r /tmp/ci-out/. .
          echo "${GITHUB_SHA}" > SHA
          git add -A
          git commit -m "CI results for ${GITHUB_SHA}" >/dev/null
          git push -f origin ci-results
