# Installs the latest release APK in an Android emulator and runs a real download. Actions tab → Emulator test → Run.
name: Emulator test
on:
  workflow_dispatch:
    inputs:
      tag: { description: "Release tag with the APK", default: "build-21" }
  push:
    paths: ["tool/emulator_test.sh", "tool/ui.py"]
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Get APK
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh release download "${{ inputs.tag || 'build-21' }}" -p "*.apk" -O pluck.apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tool/emulator_test.sh
