name: pluck
description: Pluck — save Reels, Shorts, pins, stories and statuses in full quality.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  dio: ^5.7.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  gal: ^2.3.0
  flutter_animate: ^4.5.0
  share_plus: ^10.1.4
  open_filex: ^4.5.0
  video_player: ^2.9.2
  webview_flutter: ^4.10.0
  font_awesome_flutter: ^10.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/pluck_page.js
